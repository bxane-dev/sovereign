name: Signed desktop release

on:
  push:
    tags:
      - "v8.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - run: python scripts/verify_version.py ${{ github.ref_name }}
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra desktop --extra build --extra dev
      - run: uv run --no-sync python -m pytest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sovereign/terminal run check
      - run: pnpm --filter @sovereign/terminal run test
      - run: pnpm --filter @sovereign/desktop run test
      - run: uv run --no-sync python scripts/build_core.py
      - run: uv run --no-sync python scripts/smoke_core.py
      - run: uv run --no-sync python scripts/build_terminal.py

      - name: Require Windows signing credentials
        if: matrix.platform == 'win'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: test -n "$WIN_CSC_LINK" && test -n "$WIN_CSC_KEY_PASSWORD"
      - name: Require Apple signing and notarization credentials
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"

      - name: Build signed Windows installer
        if: matrix.platform == 'win'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm --filter @sovereign/desktop exec electron-builder --publish never --config.forceCodeSigning=true --win --x64
      - name: Verify Windows signature
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = Get-Item -LiteralPath apps/desktop/dist/Sovereign-8.0.0-win-x64.exe
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Installer signature is $($signature.Status)" }
      - name: Build signed and notarized macOS app
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @sovereign/desktop exec electron-builder --publish never --config.forceCodeSigning=true --mac --x64
      - name: Verify macOS signature and notarization
        if: matrix.platform == 'mac'
        run: |
          codesign --verify --deep --strict apps/desktop/dist/mac/Sovereign.app
          xcrun stapler validate apps/desktop/dist/mac/Sovereign.app
      - name: Build Linux packages
        if: matrix.platform == 'linux'
        run: pnpm --filter @sovereign/desktop run dist --linux --x64

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.exe.blockmap
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/latest*.yml
            !apps/desktop/dist/builder-debug.yml
          if-no-files-found: error

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files
      - name: Compute checksums and create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-files
          sha256sum * > SHA256SUMS.txt
          cd ..
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --draft --verify-tag --title "Sovereign ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
          gh release upload "${{ github.ref_name }}" release-files/* --clobber
