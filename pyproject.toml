[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-agent"
version = "7.1.0"
description = "Local-first AI agent orchestration with FastAPI, MCP, permission-gated computer control, visual autonomy, and a Bun/Ink terminal client."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "bxane", email = "bxane-dev@users.noreply.github.com"}]
license = {text = "MIT"}
keywords = ["ai", "agent", "mcp", "fastapi", "vision", "computer-use", "ink", "bun", "local-first"]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "uvicorn>=0.30",
  "openai>=1.50",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
ml = ["torch>=2.4"]
desktop = ["pyautogui>=0.9.54", "mss>=9", "pillow>=10"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sovereign = "sovereign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
